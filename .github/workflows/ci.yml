name: CI

# Manual only (Actions tab → CI → Run workflow), to save Actions minutes. Day-to-day builds run
# locally and on the homelab build VM; see docs/tech/cmake.md#ci.
on:
  workflow_dispatch:

# Least privilege (docs/architecture/security.md): CI only reads the repository.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check documentation links
        run: python3 scripts/docs_tool.py check
      - name: Check layering (core never includes a system SDK)
        run: |
          if grep -rnE '#include <(3ds|citro2d|citro3d|SDL3/)' engine/core; then
            echo "nnh::core must not include system SDK headers (docs/architecture/platforms.md)"; exit 1
          fi

  pc-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build tools
        # SDL3 build dependencies, from https://wiki.libsdl.org/SDL3/README-linux
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build ccache
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev
          libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev
          libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      - name: Configure
        run: cmake --preset pc-debug
      - name: Build
        run: cmake --build --preset pc-debug
      - name: Test
        run: ctest --preset pc-debug
      - name: Smoke test (hello, headless)
        env:
          SDL_VIDEO_DRIVER: offscreen
          NNH_EXIT_AFTER_FRAMES: "10"
        run: build/pc-debug/examples/hello/hello

  nintendo-3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build tools
        run: apt-get update && apt-get install -y ninja-build cmake
      - name: Configure
        run: cmake --preset 3ds-release
      - name: Build
        run: cmake --build --preset 3ds-release
      - name: Release builds contain no debug-only strings (spec 002 AC-5)
        run: scripts/check_release_strings.sh build/3ds-release/examples/hello/hello.elf
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: examples-3dsx
          path: build/3ds-release/examples/**/*.3dsx

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev
      - name: Build fuzzers (clang + libFuzzer + ASan)
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ -DNNH_BUILD_FUZZERS=ON -DNNH_BUILD_EXAMPLES=OFF
          cmake --build build/fuzz --target fuzz_path fuzz_save
      - name: Fuzz (60 s per target)
        run: |
          build/fuzz/tests/fuzz_path -max_total_time=60
          build/fuzz/tests/fuzz_save -max_total_time=60
