name: Wiki

# Regenerates the GitHub wiki from the repository docs (docs/process/documentation.md).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "specs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/docs_tool.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check links
        run: python3 scripts/docs_tool.py check
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Generate pages
        run: python3 scripts/docs_tool.py wiki wiki
      - name: Publish
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date"
          else
            git commit -m "Sync wiki from ${GITHUB_SHA::7}"
            git push
          fi
